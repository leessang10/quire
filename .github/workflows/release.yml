# 출시 (16 §10.8): vX.Y.Z 태그를 푸시하면 검사·빌드한 뒤 @quiredoc/* 패키지를 npm에 올리고 GitHub Release를 만든다.
# 인증: npm Trusted Publishing (OIDC, 토큰 없음). 패키지마다 npm 설정에 이 저장소·이 워크플로를 신뢰하는 게시자로 등록한다.
# 처음 올릴 때처럼 아직 등록할 수 없으면 저장소 Secrets의 NPM_TOKEN(쓰기 권한 토큰)을 쓴다 (16 §10.8).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: npm에 올리지 않고 검사·dry-run만
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 태그와 판이 같은가
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "태그 ${GITHUB_REF_NAME}와 package.json 판 v${VERSION}이 다르다" >&2
            exit 1
          fi
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md에 [${VERSION}] 절이 없다" >&2; exit 1; }

      # Trusted Publishing은 npm 11.5.1 이상
      - run: npm install -g npm@^11.6
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --config vitest.fast.config.ts
      - run: node scripts/build-fonts.mjs
      - run: node scripts/golden.mjs
        env:
          QUIRE_BENCH_BROWSER: /usr/bin/google-chrome
      - run: node scripts/build-packages.mjs

      - name: npm에 올리기
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.dry-run == false }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            # NPM_TOKEN이 없으면 Trusted Publishing (OIDC)으로 인증한다
            if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN 없음: Trusted Publishing으로 올린다"; fi
            node scripts/release.mjs --publish
          else
            node scripts/release.mjs
          fi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && (/^## \[/ || /^\[[^]]+\]: /) {exit} on' CHANGELOG.md > notes.md
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" .build/packs/*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md $PRE
