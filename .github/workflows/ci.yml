# CI (16 §3): 푸시·PR마다 타입 검사와 빠른 시험, 매일 느린 시험
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: 타입 검사·빠른 시험·골든
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --config vitest.fast.config.ts
      # 레이아웃 골든 (16 §5): 기준 문서를 브라우저(조각 글꼴 편집기·통째 글꼴)에서 조판해 Node 기대값과 같은지
      - run: node scripts/build-fonts.mjs
      - run: node scripts/golden.mjs
        env:
          QUIRE_BENCH_BROWSER: /usr/bin/google-chrome

  slow:
    name: 느린 시험
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.slow.config.ts

  bench:
    name: 성능 벤치마크 (목표만)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-fonts.mjs
      # 러너는 기준선(개발 기기)과 기기가 달라 06 §3 목표만 본다. 결과는 기록으로 남긴다
      - run: node scripts/bench.mjs --targets-only --out bench-result.json
        env:
          QUIRE_BENCH_BROWSER: /usr/bin/google-chrome
          QUIRE_BENCH_MACHINE: GitHub ubuntu-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: bench-result.json
