<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quire Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <strong class="brand">Quire</strong>
      <span class="phase">0단계 프로토타입</span>
      <div class="actions">
        <button data-doc="sample">예제 문서</button>
        <button data-doc="format">서식 예제</button>
        <button data-doc="sections">구역 예제</button>
        <button data-doc="100">100쪽 생성</button>
        <button data-doc="1000">1,000쪽 생성</button>
        <button data-doc="10000">10,000쪽 생성</button>
        <button data-doc="empty">빈 문서</button>
        <a class="link" href="/collab.html">협업 데모</a>
        <a class="link" href="/live.html">실시간 편집</a>
        <a class="link" href="/checklist.html">실제 환경 확인</a>
        <a class="link" href="/shaping.html">셰이핑 검증</a>
      </div>
    </header>
    <div class="format-bar" role="toolbar" aria-label="문단 서식">
      <label>스타일
        <select id="para-style">
          <option value="body">본문</option>
          <option value="h1">제목 1</option>
          <option value="h2">제목 2</option>
          <option value="h3">제목 3</option>
          <option value="quote">인용</option>
        </select>
      </label>
      <button data-align="left" aria-pressed="false" title="왼쪽 정렬 (Ctrl+L)">왼쪽</button>
      <button data-align="center" aria-pressed="false" title="가운데 정렬 (Ctrl+E)">가운데</button>
      <button data-align="right" aria-pressed="false" title="오른쪽 정렬 (Ctrl+R)">오른쪽</button>
      <button data-align="justify" aria-pressed="false" title="양쪽 맞춤 (Ctrl+J)">양쪽</button>
      <label>줄 간격
        <select id="para-line">
          <option value="">기본</option>
          <option value="1.15">1.15</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
        </select>
      </label>
      <button data-list="bullet" aria-pressed="false" title="글머리 목록 (Ctrl+Shift+8)">• 글머리</button>
      <button data-list="number" aria-pressed="false" title="번호 목록 (Ctrl+Shift+7)">1. 번호</button>
      <button id="para-outdent" title="내어쓰기">← 들여쓰기</button>
      <button id="para-indent" title="들여쓰기">들여쓰기 →</button>
      <button id="restyle-h1" title="제목 1 스타일 정의를 바꾼다 (그 문단만 다시 조판)">제목 1 색 바꾸기</button>
    </div>
    <div class="format-bar" role="toolbar" aria-label="글자 서식">
      <button data-mark="bold" aria-pressed="false" title="굵게 (Ctrl+B)"><b>가</b></button>
      <button data-mark="italic" aria-pressed="false" title="기울임 (Ctrl+I)"><i>가</i></button>
      <button data-mark="underline" aria-pressed="false" title="밑줄 (Ctrl+U)"><u>가</u></button>
      <button data-mark="strike" aria-pressed="false" title="취소선 (Ctrl+Shift+X)"><s>가</s></button>
      <button data-script="sup" aria-pressed="false" title="위 첨자 (Ctrl+.)">x²</button>
      <button data-script="sub" aria-pressed="false" title="아래 첨자 (Ctrl+,)">x₂</button>
      <label>크기
        <select id="fmt-size">
          <option value="">기본</option>
          <option value="9000">9pt</option>
          <option value="12000">12pt</option>
          <option value="14000">14pt</option>
          <option value="18000">18pt</option>
          <option value="24000">24pt</option>
          <option value="36000">36pt</option>
        </select>
      </label>
      <label>색
        <select id="fmt-color">
          <option value="">기본</option>
          <option value="#c01c28">빨강</option>
          <option value="#1a5fb4">파랑</option>
          <option value="#26a269">초록</option>
        </select>
      </label>
      <label>형광펜
        <select id="fmt-highlight">
          <option value="">없음</option>
          <option value="#fff3a3">노랑</option>
          <option value="#c8f7c5">연두</option>
          <option value="#ffd1dc">분홍</option>
        </select>
      </label>
      <button id="fmt-clear" title="서식 지우기 (Ctrl+\)">서식 지우기</button>
      <button id="img-insert" title="이미지 넣기 (붙여넣기·끌어 놓기도 됨)">이미지 넣기</button>
      <button id="img-alt" title="선택한 이미지의 대체 텍스트">대체 텍스트</button>
      <label>배치
        <select id="img-place" title="선택한 이미지의 배치">
          <option value="inline">글자처럼</option>
          <option value="square">어울림</option>
          <option value="topBottom">자리 차지</option>
          <option value="front">글 앞</option>
          <option value="behind">글 뒤</option>
        </select>
      </label>
      <input id="img-file" type="file" accept="image/*" hidden />
      <button id="tbl-insert" title="표 넣기 (3 × 3)">표 넣기</button>
      <span class="tbl-tools" hidden>
        <button data-tbl="rowBelow" title="아래에 행">행+</button>
        <button data-tbl="colRight" title="오른쪽에 열">열+</button>
        <button data-tbl="delRow" title="행 지우기">행−</button>
        <button data-tbl="delCol" title="열 지우기">열−</button>
        <button data-tbl="merge" title="셀 병합 (Shift+클릭이나 끌어서 셀 범위를 고른 뒤)">병합</button>
        <button data-tbl="unmerge" title="병합 나누기">나누기</button>
        <button data-tbl="fill" title="셀 배경 (회색 / 해제)">배경</button>
        <button data-tbl="delete" title="표 지우기">표 지우기</button>
      </span>
      <button id="sec-break" title="구역 나누기 (Ctrl+Alt+Enter): 캐럿에서 문단을 나누고 뒤를 새 쪽에서 시작">구역 나누기</button>
      <button id="page-setup" title="캐럿이 든 구역의 용지·방향·여백·시작 방식">쪽 설정</button>
    </div>
    <dialog id="page-dialog" class="page-dialog" aria-labelledby="page-dialog-title">
      <form method="dialog">
        <h2 id="page-dialog-title">쪽 설정 <span id="page-section" class="muted"></span></h2>
        <label>용지
          <select name="paper">
            <option value="A4">A4 (210 × 297 mm)</option>
            <option value="A3">A3 (297 × 420 mm)</option>
            <option value="A5">A5 (148 × 210 mm)</option>
            <option value="B5">B5 (176 × 250 mm)</option>
            <option value="Letter">Letter (8.5 × 11 in)</option>
            <option value="Legal">Legal (8.5 × 14 in)</option>
            <option value="custom">사용자 지정</option>
          </select>
        </label>
        <fieldset class="row">
          <legend>크기 (mm)</legend>
          <label>너비 <input name="width" type="number" min="50" max="1000" step="0.1" /></label>
          <label>높이 <input name="height" type="number" min="50" max="1000" step="0.1" /></label>
        </fieldset>
        <fieldset class="row">
          <legend>방향</legend>
          <label><input type="radio" name="orient" value="portrait" /> 세로</label>
          <label><input type="radio" name="orient" value="landscape" /> 가로</label>
        </fieldset>
        <fieldset class="row">
          <legend>여백 (mm)</legend>
          <label>위 <input name="mt" type="number" min="0" max="200" step="0.1" /></label>
          <label>아래 <input name="mb" type="number" min="0" max="200" step="0.1" /></label>
          <label>왼쪽 <input name="ml" type="number" min="0" max="200" step="0.1" /></label>
          <label>오른쪽 <input name="mr" type="number" min="0" max="200" step="0.1" /></label>
        </fieldset>
        <label>구역 시작
          <select name="start">
            <option value="nextPage">다음 쪽</option>
            <option value="continuous">이어서 (같은 쪽)</option>
            <option value="evenPage">짝수 쪽</option>
            <option value="oddPage">홀수 쪽</option>
          </select>
        </label>
        <p id="page-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="sec-remove" title="이 구역 끝의 구역 나눔을 지운다: 다음 구역에 합쳐지고 다음 구역 설정이 남는다">구역 나눔 지우기</button>
          <span class="spacer"></span>
          <button value="cancel" formnovalidate>취소</button>
          <button value="ok" class="primary">적용</button>
        </div>
      </form>
    </dialog>
    <main class="layout">
      <section id="editor" class="editor" aria-label="편집기"></section>
      <aside class="panel">
        <h2>상태</h2>
        <label class="input-mode">입력 층
          <select id="input-mode">
            <option value="auto">자동</option>
            <option value="editcontext">A. EditContext</option>
            <option value="textarea">B. 숨긴 textarea</option>
          </select>
        </label>
        <dl id="stats" class="stats"></dl>
        <div class="log-head">
          <h2>입력 이벤트</h2>
          <button id="clear-log">지우기</button>
        </div>
        <ol id="log" class="log" aria-live="off"></ol>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
